<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BlackLab Desktop</title>
  <meta name="description" content="Control center for the BlackLab app: assistant, dashboard and every setting, synced with your phone.">
  <meta name="theme-color" content="#0B0F0E">
  <meta name="referrer" content="no-referrer">
  <!-- This page holds a Google Drive token while you're signed in: only its own scripts and Google's
       sign-in library may run, so injected text can never execute. connect-src allows the phone
       link (USB 127.0.0.1, or Wi-Fi when opened from the companion) and Google's APIs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ https://www.googleapis.com https://openidconnect.googleapis.com http://127.0.0.1:* http://localhost:* http:; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name">BlackLab</div>
          <div class="brand-sub" id="brandSub">Desktop</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="connBadge" class="conn-badge">Not connected</div>
        <button class="ghost small" id="paletteBtn" title="Command palette (Ctrl+K)">⌘K Commands</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="crumb" id="crumb">Dashboard</div>
        <div class="top-actions">
          <span id="syncState" class="sync-state"></span>
          <button class="icon-btn" id="refreshBtn" title="Refresh (R)" aria-label="Refresh">⟳</button>
          <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
          <div id="gsiSlot" class="gsi-slot"></div>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-box">
      <input id="paletteInput" placeholder="Type a command, a setting, or ask the assistant…" autocomplete="off">
      <ul id="paletteList"></ul>
      <div class="palette-hint">↑↓ to move · Enter to run · Esc to close · “&gt; text” asks the assistant</div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="data.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
