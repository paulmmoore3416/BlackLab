# Weekly update PRs for the Android build and the CI actions (actions are pinned by commit SHA).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 8
    # AGP 9 is a migration (built-in Kotlin, new DSL), and the AndroidX releases that need it also need
    # compileSdk 37 — those come in a planned upgrade, not a weekly PR.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # Gradle 9.6+ removed an internal API that AGP 8.x uses — the wrapper moves to 9 together with AGP 9
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*"]
      play-services-and-mlkit:
        patterns: ["com.google.android.gms*", "com.google.mlkit*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
